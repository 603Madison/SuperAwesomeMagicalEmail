[package]
name = "superawesomemagicalemail"
version = "0.1.0"
edition = "2024"
description = "Your SuperAwesomeMagicalEmail server on the Linux desktop"
license = "GPL-3.0-only"
homepage = "https://github.com/603Madison/SuperAwesomeMagicalEmail"
repository = "https://github.com/603Madison/SuperAwesomeMagicalEmail"
readme = "README.md"
publish = false

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
anyhow = "1.0.104"
base64 = "0.23.1"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "multipart", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
url = "2.5.8"
webkit = { version = "0.6.1", package = "webkit6" }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# `cargo deb`: the package for Ubuntu (24.04 and later), Debian 13, Mint 22, Pop!_OS 24.04.
[package.metadata.deb]
name = "superawesomemagicalemail"
maintainer = "SuperAwesomeMagicalEmail <superawesomemagicalemail@users.noreply.github.com>"
copyright = "SuperAwesomeMagicalEmail contributors"
section = "mail"
priority = "optional"
extended-description = "Your SuperAwesomeMagicalEmail server on the desktop: every mailbox it gives you, read and written natively with GTK, with notifications for new mail."
depends = "$auto"
assets = [
    ["target/release/superawesomemagicalemail", "usr/bin/", "755"],
    ["data/io.github._603madison.SuperAwesomeMagicalEmail.desktop", "usr/share/applications/", "644"],
    ["data/io.github._603madison.SuperAwesomeMagicalEmail.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/systemd/superawesomemagicalemail-background.service", "usr/lib/systemd/user/", "644"],
    ["data/systemd/superawesomemagicalemail-background.timer", "usr/lib/systemd/user/", "644"],
    ["data/icons/hicolor/scalable/apps/*", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["data/icons/hicolor/scalable/actions/*", "usr/share/icons/hicolor/scalable/actions/", "644"],
    ["data/icons/hicolor/16x16/apps/*", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["data/icons/hicolor/24x24/apps/*", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["data/icons/hicolor/32x32/apps/*", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["data/icons/hicolor/48x48/apps/*", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["data/icons/hicolor/64x64/apps/*", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["data/icons/hicolor/128x128/apps/*", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["data/icons/hicolor/256x256/apps/*", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["data/icons/hicolor/512x512/apps/*", "usr/share/icons/hicolor/512x512/apps/", "644"],
]

# `cargo generate-rpm`: the package for Fedora (40 and later), and SuperAwesomeMagicalLinux
# (`rpm-ostree install` it).
[package.metadata.generate-rpm]
name = "superawesomemagicalemail"
summary = "Read your SuperAwesomeMagicalEmail server's mail"
# Built on Ubuntu, so not from what the binary links there (Ubuntu's library versions, which
# Fedora doesn't have): Fedora's own packages, below.
auto-req = "no"
assets = [
    { source = "target/release/superawesomemagicalemail", dest = "/usr/bin/superawesomemagicalemail", mode = "755" },
    { source = "data/io.github._603madison.SuperAwesomeMagicalEmail.desktop", dest = "/usr/share/applications/io.github._603madison.SuperAwesomeMagicalEmail.desktop", mode = "644" },
    { source = "data/io.github._603madison.SuperAwesomeMagicalEmail.metainfo.xml", dest = "/usr/share/metainfo/io.github._603madison.SuperAwesomeMagicalEmail.metainfo.xml", mode = "644" },
    { source = "data/systemd/superawesomemagicalemail-background.service", dest = "/usr/lib/systemd/user/superawesomemagicalemail-background.service", mode = "644" },
    { source = "data/systemd/superawesomemagicalemail-background.timer", dest = "/usr/lib/systemd/user/superawesomemagicalemail-background.timer", mode = "644" },
    { source = "data/icons/hicolor/scalable/apps/io.github._603madison.SuperAwesomeMagicalEmail.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github._603madison.SuperAwesomeMagicalEmail.svg", mode = "644" },
    { source = "data/icons/hicolor/scalable/actions/same-inbox-symbolic.svg", dest = "/usr/share/icons/hicolor/scalable/actions/same-inbox-symbolic.svg", mode = "644" },
    { source = "data/icons/hicolor/scalable/actions/same-archive-symbolic.svg", dest = "/usr/share/icons/hicolor/scalable/actions/same-archive-symbolic.svg", mode = "644" },
    { source = "data/icons/hicolor/16x16/apps/io.github._603madison.SuperAwesomeMagicalEmail.png", dest = "/usr/share/icons/hicolor/16x16/apps/io.github._603madison.SuperAwesomeMagicalEmail.png", mode = "644" },
    { source = "data/icons/hicolor/24x24/apps/io.github._603madison.SuperAwesomeMagicalEmail.png", dest = "/usr/share/icons/hicolor/24x24/apps/io.github._603madison.SuperAwesomeMagicalEmail.png", mode = "644" },
    { source = "data/icons/hicolor/32x32/apps/io.github._603madison.SuperAwesomeMagicalEmail.png", dest = "/usr/share/icons/hicolor/32x32/apps/io.github._603madison.SuperAwesomeMagicalEmail.png", mode = "644" },
    { source = "data/icons/hicolor/48x48/apps/io.github._603madison.SuperAwesomeMagicalEmail.png", dest = "/usr/share/icons/hicolor/48x48/apps/io.github._603madison.SuperAwesomeMagicalEmail.png", mode = "644" },
    { source = "data/icons/hicolor/64x64/apps/io.github._603madison.SuperAwesomeMagicalEmail.png", dest = "/usr/share/icons/hicolor/64x64/apps/io.github._603madison.SuperAwesomeMagicalEmail.png", mode = "644" },
    { source = "data/icons/hicolor/128x128/apps/io.github._603madison.SuperAwesomeMagicalEmail.png", dest = "/usr/share/icons/hicolor/128x128/apps/io.github._603madison.SuperAwesomeMagicalEmail.png", mode = "644" },
    { source = "data/icons/hicolor/256x256/apps/io.github._603madison.SuperAwesomeMagicalEmail.png", dest = "/usr/share/icons/hicolor/256x256/apps/io.github._603madison.SuperAwesomeMagicalEmail.png", mode = "644" },
    { source = "data/icons/hicolor/512x512/apps/io.github._603madison.SuperAwesomeMagicalEmail.png", dest = "/usr/share/icons/hicolor/512x512/apps/io.github._603madison.SuperAwesomeMagicalEmail.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
gtk4 = ">= 4.14"
libadwaita = ">= 1.5"
"webkitgtk6.0" = "*"
openssl-libs = "*"
fontconfig = "*"
