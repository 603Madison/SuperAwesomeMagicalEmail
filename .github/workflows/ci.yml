name: Checks

# Every push and pull request: the server's tests (against a real IMAP/SMTP server, GreenMail), the
# web app's type check and build, the Android app's tests, lint and debug APK, and the desktop
# app's tests and build.
on:
  push:
  pull_request:

jobs:
  server-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web app
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Server tests
        env:
          SAME_SERVER_ONLY: "1"
        run: ./gradlew --no-daemon :server:test :server:installDist

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests, lint and a debug APK
        run: ./gradlew --no-daemon :android:testDebugUnitTest :android:lintDebug :android:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SuperAwesomeMagicalEmail-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: android/build/outputs/screenshots/
          retention-days: 7
          if-no-files-found: ignore

  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: GTK 4, libadwaita and WebKitGTK to build against
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Tests and a build
        working-directory: desktop
        run: cargo test --locked && cargo build --release --locked
